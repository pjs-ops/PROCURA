<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="procuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4774C" />
      <stop offset="60%" stop-color="#B8A06A" />
      <stop offset="100%" stop-color="#D4774C" />
    </linearGradient>
    <linearGradient id="procuraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4774C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2A222D" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Base Hexagonal Mesh / Node Grid -->
  <polygon points="50,8 88,30 88,70 50,92 12,70 12,30" stroke="#3D3342" stroke-width="2" fill="#211B24" />
  
  <!-- Flow Lines connecting nodes -->
  <line x1="50" y1="20" x2="30" y2="52" stroke="#B8A06A" stroke-width="2.5" stroke-dasharray="3 2" opacity="0.8" />
  <line x1="50" y1="20" x2="70" y2="52" stroke="#D4774C" stroke-width="2.5" opacity="0.9" />
  <line x1="30" y1="52" x2="50" y2="80" stroke="#D4774C" stroke-width="2.5" opacity="0.9" />
  <line x1="70" y1="52" x2="50" y2="80" stroke="#B8A06A" stroke-width="2.5" stroke-dasharray="3 2" opacity="0.8" />
  <line x1="30" y1="52" x2="70" y2="52" stroke="#F3EBDD" stroke-width="1.5" opacity="0.5" />

  <!-- Intelligent Central Focal Node -->
  <circle cx="50" cy="50" r="14" fill="#2A222D" stroke="url(#procuraGrad)" stroke-width="3" />
  <polygon points="50,42 57,50 50,58 43,50" fill="#D4774C" />
  <circle cx="50" cy="50" r="3" fill="#F3EBDD" />

  <!-- Outer Satellite Nodes -->
  <circle cx="50" cy="20" r="5" fill="#D4774C" />
  <circle cx="30" cy="52" r="4.5" fill="#B8A06A" />
  <circle cx="70" cy="52" r="4.5" fill="#D4774C" />
  <circle cx="50" cy="80" r="5" fill="#8FAF78" />
</svg>
